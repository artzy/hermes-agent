name: Upstream sync

# NousResearch/hermes-agent 의 main 을 이 fork 로 매일 자동 병합한다.
# 충돌이 예상되면 병합을 시도하지 않고 이슈로 보고한다.
#
# 기본 GITHUB_TOKEN 은 .github/workflows/* 변경을 push 하지 못하므로
# repo+workflow scope 의 classic PAT 를 UPSTREAM_SYNC_TOKEN secret 으로 사용한다.

on:
  schedule:
    - cron: '0 21 * * *' # 06:00 KST (UTC+9)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/NousResearch/hermes-agent.git
  UPSTREAM_BRANCH: main
  SYNC_LABEL: upstream-sync
  # gh 는 fork 에서 기본 대상을 부모 저장소로 잡는다. 항상 이 fork 를 가리키게 고정한다.
  GH_REPO: ${{ github.repository }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Require UPSTREAM_SYNC_TOKEN
        env:
          SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::Repository secret UPSTREAM_SYNC_TOKEN 이 없습니다. classic PAT(repo+workflow)를 등록하세요."
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          # workflow 파일 변경을 포함한 push 에 필요 (GITHUB_TOKEN 으로는 거부됨)
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          persist-credentials: true

      - name: Fetch upstream
        id: fetch
        run: |
          git remote add upstream "$UPSTREAM_REPO"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"
          behind=$(git rev-list --count "HEAD..upstream/$UPSTREAM_BRANCH")
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          echo "upstream 대비 뒤처진 커밋: $behind"

      - name: Detect conflicts
        id: precheck
        if: steps.fetch.outputs.behind != '0'
        run: |
          # merge-tree 는 워킹트리를 건드리지 않고 병합 결과만 계산한다.
          # 충돌 시 종료 코드 1, 첫 줄은 트리 OID, 그 뒤가 충돌 파일 목록이다.
          if out=$(git merge-tree --write-tree --name-only HEAD "upstream/$UPSTREAM_BRANCH"); then
            echo "conflicts=" >> "$GITHUB_OUTPUT"
            echo "충돌 없음"
          else
            files=$(printf '%s\n' "$out" | awk 'NR > 1 { if ($0 == "") exit; print }')
            {
              echo "conflicts<<CONFLICT_EOF"
              printf '%s\n' "$files"
              echo "CONFLICT_EOF"
            } >> "$GITHUB_OUTPUT"
            echo "충돌 파일:"
            printf '%s\n' "$files"
          fi

      - name: Merge and push
        id: merge
        if: steps.fetch.outputs.behind != '0' && steps.precheck.outputs.conflicts == ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # PAT push 는 다른 워크플로를 깨울 수 있어 [skip ci] 로 CI 폭주를 막는다.
          git merge --no-edit -m "Merge remote-tracking branch 'upstream/main' [skip ci]" \
            "upstream/$UPSTREAM_BRANCH"
          git push origin HEAD:main
          echo "머지 완료: $(git rev-parse --short HEAD)"

      - name: Report to issue
        if: ${{ !cancelled() && (steps.precheck.outputs.conflicts != '' || failure()) }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CONFLICTS: ${{ steps.precheck.outputs.conflicts }}
          BEHIND: ${{ steps.fetch.outputs.behind }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "upstream 자동 동기화가 완료되지 못했습니다."
            echo
            echo "- 실행: $RUN_URL"
            echo "- upstream 대비 뒤처진 커밋: ${BEHIND:-unknown}"
            echo
            if [ -n "$CONFLICTS" ]; then
              echo "## 충돌 파일"
              echo
              printf '%s\n' "$CONFLICTS" | sed 's/^/- /'
              echo
              echo "머지는 시도하지 않았습니다. 저장소는 그대로입니다."
            else
              echo "## 실패"
              echo
              echo "충돌 사전 검사는 통과했으나 fetch/merge/push 단계에서 실패했습니다."
              echo "자세한 내용은 위 실행 로그를 확인하세요."
            fi
            echo
            echo '## 로컬에서 해결하기'
            echo
            echo '```bash'
            echo 'git fetch upstream'
            echo 'git merge upstream/main'
            echo '# 충돌 해결 후'
            echo 'git push origin main'
            echo '```'
          } > body.md

          # --repo 를 명시해 fork 가 아닌 부모 저장소로 가는 것을 막는다.
          gh label create "$SYNC_LABEL" \
            --repo "$GITHUB_REPOSITORY" \
            --color B60205 \
            --description 'upstream 자동 동기화 실패' \
            --force

          existing=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --label "$SYNC_LABEL" \
            --state open \
            --limit 1 \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file body.md
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "upstream 동기화 실패 ($(date -u '+%Y-%m-%d'))" \
              --label "$SYNC_LABEL" \
              --body-file body.md
          fi
